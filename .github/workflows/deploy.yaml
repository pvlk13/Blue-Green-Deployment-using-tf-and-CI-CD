name: "Production Blue-Green Deployment"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: account_info  # CHANGED THIS TO BE UNIQUE
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: terraform init

      # --- STEP 1: CREATE BUCKET ONLY ---
      - name: Terraform Apply Bucket
        run: terraform apply -target=aws_s3_bucket.eb_artifacts -auto-approve

      # --- STEP 2: PACKAGE AND UPLOAD ---
      - name: Package Application Code
        working-directory: .
        run: |
          zip -j ./app-${{ github.sha }}.zip ./src/application.py ./src/requirements.txt
          mv ./app-${{ github.sha }}.zip ./terraform/

      - name: Upload to S3
        run: |
          # Matches the hardcoded name we set
          aws s3 cp ./app-${{ github.sha }}.zip s3://vijaya-artifacts-19a5-272183979798/app-${{ github.sha }}.zip
          sleep 10

      # --- STEP 3: FULL INFRASTRUCTURE DEPLOY ---
      - name: Terraform Apply Full
        run: terraform apply -auto-approve -var="app_version=app-${{ github.sha }}"

      # --- STEP 4: HEALTH CHECK ---
      - name: Wait for Green Health
        run: |
          # 1. Find the actual name (it will find app-green-19a5 automatically)
          REAL_GREEN_NAME=$(aws elasticbeanstalk describe-environments --query "Environments[?starts_with(EnvironmentName, 'app-green')].EnvironmentName" --output text | awk '{print $1}')
          
          echo "Targeting Environment: $REAL_GREEN_NAME"

          if [ "$REAL_GREEN_NAME" == "None" ] || [ -z "$REAL_GREEN_NAME" ]; then
            echo "Error: Could not find an environment starting with 'app-green'"
            exit 1
          fi

          # 2. Start the loop using the REAL name
          for i in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$REAL_GREEN_NAME" --query "Environments[0].Status" --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments --environment-names "$REAL_GREEN_NAME" --query "Environments[0].Health" --output text)
            
            echo "Current Status of $REAL_GREEN_NAME: $STATUS, Health: $HEALTH (Attempt $i)"
            
            # Check for Ready status
            if [ "$STATUS" == "Ready" ]; then
              echo "Environment $REAL_GREEN_NAME is Ready!"
              exit 0
            fi
            sleep 30
          done
          echo "Error: Environment timed out."
          exit 1    
          echo "Waiting for app-green-tf to reach Ready state..."
          for i in {1..30}; do
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names app-green-tf --query "Environments[0].Status" --output text)
            HEALTH=$(aws elasticbeanstalk describe-environments --environment-names app-green-tf --query "Environments[0].Health" --output text)
            echo "Current Status: $STATUS, Health: $HEALTH (Attempt $i)"
            if [ "$STATUS" == "Ready" ] && [ "$HEALTH" == "Green" ]; then
              echo "Environment is Healthy!"
              exit 0
            fi
            sleep 30
          done
          exit 1

      # --- STEP 5: SWAP ---
      - name: Swap CNAMEs
        run: |
          aws elasticbeanstalk swap-environment-cnames \
            --source-environment-name app-blue-tf \
            --destination-environment-name app-green-tf